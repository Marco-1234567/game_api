name: ci med h2 databas

on:
  push:
    branches: ["**"]

  pull_request:
    branches: ["dev"]

jobs:
  build-and-test:   # name
    runs-on: ubuntu-latest

    steps:
      # checkout our code
      - name: checkout code
        uses: actions/checkout@v6

      # get version of Java to VM
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
          cache: 'maven'          # faster

      # build and run tests
      - name: build and run tests
        run: mvn -B clean verify